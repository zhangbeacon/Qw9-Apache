# =============================================================================
# Apache httpd 2.4.49 复现配置（主配置：CVE-2021-41773 路径穿越 / RCE）
# 子智能体 C / 端口 8082
#
# 关键点（详见 report/CVE-2021-41773.md）：
#   1. <Directory /> 显式 "Require all granted" —— 2.4.49 路径穿越能读到根文件系统
#      的前提。这模拟"接近真实部署的宽松配置"（默认发行版多为 Require all denied）。
#   2. ScriptAlias /cgi-bin/ + mod_cgid —— 穿越到 /bin/sh 后可执行任意命令。
#   3. 故意不写 User/Group：实验环境让 httpd 以 root 运行，使 RCE 的 `id`
#      输出 root，便于判定；生产环境绝不可这样。
# =============================================================================
ServerRoot "/opt/httpd"
ServerName 127.0.0.1:8082
Listen 8082
PidFile "logs/httpd.pid"

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
LimitRequestLine 8190

# ---- MPM / 基础模块 ----
# MPM(event) 与 mod_so 是编译进 httpd 的静态模块，无需 LoadModule
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule autoindex_module modules/mod_autoindex.so

# ---- 漏洞相关模块 ----
# CGI：41773 的 RCE 需要；mod_cgid 用于 event MPM
LoadModule cgid_module modules/mod_cgid.so
# Lua：CVE-2021-44790 需要（本文件也加载，便于切换配置）
LoadModule lua_module modules/mod_lua.so
# proxy：CVE-2021-44224 需要
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ErrorLog "logs/error_log"
LogLevel info
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" common

DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    AllowOverride None
    Options Indexes FollowSymLinks
    Require all granted
</Directory>

# 41773 关键：根目录全部放行（宽松配置）
<Directory />
    AllowOverride None
    Require all granted
</Directory>

# 41773 任意文件读取关键：Alias-like 前缀。CVE 描述即为
# "map URLs to files outside the directories configured by Alias-like directives"。
# Alias 的 translate 直接生成绝对文件名，绕开 DocumentRoot 的 "above root" 检查；
# 再用 .%2e 穿越即可静态读取 /etc/passwd。（ScriptAlias 前缀会走 CGI 执行，见下）
Alias /icons/ "/opt/httpd/icons/"
<Directory "/opt/httpd/icons">
    AllowOverride None
    Options Indexes MultiViews
    Require all granted
</Directory>

# 41773 RCE 关键：/cgi-bin/ 下的请求按 CGI 处理
ScriptAlias /cgi-bin/ "/opt/httpd/cgi-bin/"
<Directory "/opt/httpd/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

TypesConfig conf/mime.types
DirectoryIndex index.html
