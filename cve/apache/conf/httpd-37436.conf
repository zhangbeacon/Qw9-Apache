# =============================================================================
# Apache httpd 2.4.49 —— CVE-2022-37436（恶意后端触发响应头截断 → 响应走私）
#
# 复现拓扑：
#   client -> httpd:8092 (mod_proxy_http, ProxyPass "/") -> 假后端:8093
#
# 漏洞点（modules/proxy/mod_proxy_http.c, ap_proxy_read_headers）：
#   2.4.49 的 ap_proxygetline() 在 ap_rgetline() 返回非 SUCCESS/ENOSPC 时把
#   *read 置 -1（例如头行含 NUL 触发 APR_EINVAL）；ap_proxy_read_headers 只判断
#   len <= 0 就 break，忽略 rc，把“已读到的头”当成完整头返回。调用方于是把后端
#   流中剩余的字节（后续 Set-Cookie / X-Frame-Options 等安全头）当作 body 转发。
#   对超过 ResponseFieldSize（默认 8192）的行，ENOSPC 时旧代码只告警，继续用
#   截断后的头。2.4.55 的修复让 ap_proxy_read_headers 返回 apr_status_t，任何
#   非 APR_SUCCESS 都清空 headers_out 并由调用方回 502。
#
# 本配置保持默认 ResponseFieldSize（8192），不启用 ProxyBadHeader StartBody，
# 即默认 IsError 语义，证明该问题在默认配置下即可触发。
# =============================================================================
ServerRoot "/opt/httpd"
ServerName 127.0.0.1:8092
Listen 8092
PidFile "logs/httpd-37436.pid"

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# MPM(event) 与 mod_so 为静态编译，无需 LoadModule
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ErrorLog "logs/error_log-37436"
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log-37436" common

DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    Require all granted
</Directory>
<Directory />
    Require all granted
</Directory>

ProxyRequests Off
ProxyPass        "/" "http://127.0.0.1:8093/"
ProxyPassReverse "/" "http://127.0.0.1:8093/"

TypesConfig conf/mime.types
