# =============================================================================
# Apache httpd 2.4.49 —— CVE-2023-27522（mod_proxy_uwsgi 响应走私）
#
# 复现拓扑：
#   client -> httpd:8092 (mod_proxy_uwsgi, ProxyPass "/") -> uwsgi 假后端:8094
#
# 漏洞点（modules/proxy/mod_proxy_uwsgi.c, uwsgi_response）：
#   2.4.49 逐行 ap_getline() 解析 uwsgi 后端返回的 HTTP 响应文本，但不校验
#   头行长度、头名 token 与头值字符集。头值中的 NUL/裸 CR/非法头名会被直接
#   接受或导致解析提前结束，剩余字节（含 Set-Cookie、X-Frame-Options）被当作
#   body 转发；超过 8192 字节的头行被截断后仍作为头转发。
#   2.4.56 的修复增加长度检查、ap_scan_http_token()（头名）与
#   ap_scan_http_field_content()（头值）校验，非法即重置 headers_out 并回 502。
# =============================================================================
ServerRoot "/opt/httpd"
ServerName 127.0.0.1:8092
Listen 8092
PidFile "logs/httpd-27522.pid"

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# MPM(event) 与 mod_so 为静态编译，无需 LoadModule
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_uwsgi_module modules/mod_proxy_uwsgi.so

ErrorLog "logs/error_log-27522"
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log-27522" common

DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    Require all granted
</Directory>
<Directory />
    Require all granted
</Directory>

ProxyRequests Off
ProxyPass "/" "uwsgi://127.0.0.1:8094/"

TypesConfig conf/mime.types
