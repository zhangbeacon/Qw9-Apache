# =============================================================================
# Apache httpd 2.4.49 —— CVE-2021-44224（forward proxy + UDS：SSRF / NULL deref）
#
# 复现配置同时启用：
#   ProxyRequests On                    -> 正向代理（攻击面）
#   ProxyPass ... unix:/tmp/...sock     -> 声明的 UDS 反向代理 worker
#   ProxyPass ... http://backend...     -> 普通 TCP worker（无 UDS）
# 两种 worker 覆盖 CVE 的两个 SSRF 变体：
#   A) 攻击者 URI 命中 UDS worker：请求被导向该 worker 声明的 UDS 端点
#      （advisory 原文 "directed to a declared Unix Domain Socket endpoint"）
#   B) 攻击者 URI 命中普通 TCP worker：fix_uds_filename() 仍从请求的
#      "unix:<attacker-path>|origin" 中提取 attacker-path，写入 uds_path note；
#      因 worker->s->uds_path 为空，connect 时使用 note -> **任意 UDS 路径**。
# 2.4.52 的修复（入口强制 hostname、forward 不 de-socketfy、不调用 fix_uds_filename）
# 会把这两种请求都拦掉。
# =============================================================================
ServerRoot "/opt/httpd"
ServerName 127.0.0.1:8082
Listen 8082
PidFile "logs/httpd.pid"

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# MPM(event) 与 mod_so 为静态编译，无需 LoadModule
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so

ErrorLog "logs/error_log"
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" common

DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    Require all granted
</Directory>
<Directory />
    Require all granted
</Directory>

# 正向代理
ProxyRequests On
ProxyVia On
<Proxy "*">
    Require all granted
</Proxy>

# A) 声明的 UDS 反向代理端点（worker 自带 uds_path，连接时优先使用它）
ProxyPass        "/reverse-uds/" "unix:/tmp/cve-2021-44224.sock|http://uds.internal/"
ProxyPassReverse "/reverse-uds/" "http://uds.internal/"

# B) 普通 TCP worker（worker->s->uds_path 为空，连接时会退回请求 note 中的 uds_path）
ProxyPass        "/reverse-tcp/" "http://backend.internal/"
ProxyPassReverse "/reverse-tcp/" "http://backend.internal/"

TypesConfig conf/mime.types
