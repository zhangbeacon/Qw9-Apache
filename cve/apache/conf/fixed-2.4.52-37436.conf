# 修复版负向对照：Ubuntu 22.04 apache2 2.4.52-1ubuntu4.25
# （Debian/Ubuntu 已回填 CVE-2022-37436.patch，mod_proxy_http 含 AH10404）
ServerRoot "/etc/apache2"
ServerName 127.0.0.1:8092
Listen 8092
PidFile "/tmp/fixed-2.4.52-37436.pid"
Timeout 60
KeepAlive On
User www-data
Group www-data

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so

ErrorLog "/tmp/fixed-2.4.52-37436-error.log"
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "/tmp/fixed-2.4.52-37436-access.log" common

DocumentRoot "/tmp/fixed-2.4.52-www"
<Directory "/tmp/fixed-2.4.52-www">
    Require all granted
</Directory>

ProxyRequests Off
ProxyPass        "/" "http://127.0.0.1:8093/"
ProxyPassReverse "/" "http://127.0.0.1:8093/"

TypesConfig /etc/mime.types
